[project]
name = "micrograd"
version = "0.1.0"
description = "A tiny scalar-valued autograd engine with a small PyTorch-like neural network library on top."
readme = "README.md"
authors = [
    { name = "Andrej Karpathy", email = "andrej.karpathy@gmail.com" },
]
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anywidget>=0.11.0",
    "marimo>=0.25.0",
    "poethepoet>=0.48.0",
]

[project.urls]
Homepage = "https://github.com/karpathy/micrograd"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["micrograd"]

[tool.hatch.build.targets.wheel.force-include]
"micrograd/viz/model_graph.js" = "micrograd/viz/model_graph.js"
"micrograd/viz/model_graph.css" = "micrograd/viz/model_graph.css"

[tool.marimo.runtime]
# Override the user config (auto_instantiate = false) so opening this
# notebook runs cells immediately instead of waiting for a manual Run.
auto_instantiate = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["test"]

[dependency-groups]
dev = [
    "graphviz>=0.21",
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "scikit-learn>=1.9.1",
    "torch>=2.14.0",
    "ty>=0.0.82",
]

